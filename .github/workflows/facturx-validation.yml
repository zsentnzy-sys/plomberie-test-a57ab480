name: Factur-X Phase A structural checks

# Phase A only: structural PDF/A-3B checks + internal self-checks.
# This workflow does NOT perform official Factur-X XSD / EN 16931 Schematron
# validation and never qualifies the generator.

on:
  pull_request:
    paths:
      - "src/lib/facturx/**"
      - "src/lib/documents.server.ts"
      - "src/lib/invoices.server.ts"
      - "src/lib/invoices-pdf.server.ts"
      - "src/lib/invoices.functions.ts"
      - "scripts/**"
      - "supabase/migrations/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/facturx-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/facturx/**"
      - "src/lib/documents.server.ts"
      - "src/lib/invoices.server.ts"
      - "src/lib/invoices-pdf.server.ts"
      - "src/lib/invoices.functions.ts"
      - "scripts/**"
      - "supabase/migrations/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/facturx-validation.yml"
  workflow_dispatch:

env:
  # veraPDF only publishes a rolling installer URL. Pin the build by setting the
  # repository variable VERAPDF_SHA256 to the digest printed by the install step
  # below: once set, any other build fails the job.
  VERAPDF_INSTALLER_URL: "https://software.verapdf.org/releases/verapdf-installer.zip"
  VERAPDF_SHA256: ${{ vars.VERAPDF_SHA256 }}

jobs:
  structural-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Verify Factur-X artifacts
        run: |
          set -o pipefail
          bun run verify:facturx-artifacts \
            | tee facturx-artifacts-report.text

      - name: Build
        run: bun run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned veraPDF
        run: |
          set -euo pipefail
          curl -sSL --fail "$VERAPDF_INSTALLER_URL" -o verapdf.zip
          actual=$(sha256sum verapdf.zip | cut -d' ' -f1)
          echo "veraPDF installer sha256: $actual"
          if [ -z "${VERAPDF_SHA256:-}" ]; then
            echo "::error::VERAPDF_SHA256 n'est pas défini. L'installation de veraPDF ne peut pas être vérifiée."
            exit 1
          fi
          if [ "$actual" != "$VERAPDF_SHA256" ]; then
            echo "::error::Empreinte veraPDF incorrecte."
            echo "::error::Attendue : $VERAPDF_SHA256"
            echo "::error::Obtenue  : $actual"
            exit 1
          fi
          echo "Empreinte veraPDF vérifiée : $actual"
          unzip -q verapdf.zip -d verapdf-installer
          installer=$(find verapdf-installer -name 'verapdf-izpack-installer-*.jar' | head -n1)
          cat > auto-install.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>${{ github.workspace }}/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar "$installer" auto-install.xml
          echo "${{ github.workspace }}/verapdf" >> "$GITHUB_PATH"

      - name: Factur-X Phase A checks
        run: bun run validate:facturx | tee facturx-report.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facturx-phase-a-report
          path: |
            facturx-report.txt
            facturx-artifacts-report.txt
            /tmp/facturx-qualification/**
          if-no-files-found: warn